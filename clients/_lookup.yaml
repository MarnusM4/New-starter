# Client identifier -> config file stem (clients/<stem>.yaml).
#
# Onboarding requests arrive as Zoho Forms emails to the shared helpdesk mailbox, so the
# ticket doesn't carry a per-client Desk account id. Instead the agent reads the form's
# "Company's Name" value and maps it here to the right config file. Keys are matched
# case-insensitively (see lib/config.load_lookup). Fill in real entries per client.
#
# Example (real — the "Company's Name" answer on each client's form):
#   "Portland Quarry": portland
#   "Natural Selection": natural-selection
#
# These two map the example configs to themselves so dev_run / tests resolve:
example-entra: example-entra
example-local-ad: example-local-ad
