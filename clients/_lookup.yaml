# HALO client id -> config file stem (clients/<stem>.yaml).
#
# The agent reads the client off the HALO ticket, then maps it here to the right config
# file. Using HALO's numeric client id (not the name) keeps the mapping stable when a
# client is renamed in HALO. Fill in real entries once you have HALO client ids.
#
# Example (real):
#   "142": acme
#   "317": globex
#
# These two map the example configs to themselves so dev_run / tests resolve:
example-entra: example-entra
example-local-ad: example-local-ad
