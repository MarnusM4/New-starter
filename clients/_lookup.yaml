# OPTIONAL company-name aliases -> config file stem (clients/<stem>.yaml).
#
# Onboarding requests arrive as Zoho Forms emails to the shared helpdesk mailbox, so the
# agent works out the client from clues in the form summary:
#   1. the email domains in it — matched automatically against each client's Microsoft
#      tenant (verified domains), so nothing needs listing here for that;
#   2. the "Company's Name" answer, when a client's form has one — mapped via this file.
# The clues must all point at one client; otherwise the ticket is flagged for a technician.
# Keys are matched case-insensitively.
#
# Example (real — the "Company's Name" answer on a client's form):
#   "Portland Quarry": portland
#
# These two map the example configs to themselves so dev_run / tests resolve:
example-entra: example-entra
example-local-ad: example-local-ad
