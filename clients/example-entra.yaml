# Example client: Azure/Entra-only.
# Copy this to `<client-id>.yaml` and edit per real client.
client_id: example-entra
identity_path: entra

tenant_id: PLACEHOLDER-TENANT-GUID

license_skus:
  - O365_BUSINESS_PREMIUM
default_groups:
  - All-Staff
  - VPN-Users
role_group_map:
  Sales: [CRM-Users, Sales-Shared]
  Support: [Helpdesk-Agents]
usage_location: GB
upn_suffix: acme.com            # UPN/email domain; omit to use the tenant default
username_format: "{first}.{last}"  # tokens: {first} {last} {first_initial} {last_initial}

# Optional: override the intake form labels for THIS client, if their Zoho Form uses
# different wording than the Flawless defaults (lib/zoho.DEFAULT_FIELD_LABELS). Only the
# canonical fields you list here are overridden; the rest fall back to the defaults.
# field_labels:
#   new_starter_name: "New Employee Full Name"
#   job_title: "Position"
#   start_date: "First Day"

approval_required: true
