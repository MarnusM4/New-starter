# Example client: Azure/Entra-only.
# Copy this to `<client-id>.yaml` and edit per real client.
client_id: example-entra
identity_path: entra

tenant_id: PLACEHOLDER-TENANT-GUID

license_skus:
  - O365_BUSINESS_PREMIUM
default_groups:
  - All-Staff
  - VPN-Users
role_group_map:
  Sales: [CRM-Users, Sales-Shared]
  Support: [Helpdesk-Agents]
usage_location: GB
upn_suffix: acme.com            # UPN/email domain; omit to use the tenant default
username_format: "{first}.{last}"  # tokens: {first} {last} {first_initial} {last_initial}

# Optional, rarely needed: extra wordings for THIS client's form questions. Each field
# already accepts several common wordings (lib/zoho.DEFAULT_FIELD_LABELS); labels listed here
# are tried first. One label or a list. Check a form with:
#   python tools/run_ticket.py "#<ticket>" --show-labels
# field_labels:
#   new_starter_name: "Full Name of New Employee"
#   start_date: ["First Day", "First Working Day"]

# Optional, normally NOT needed: this client's email domains are read automatically from its
# Microsoft tenant (verified domains). Only list a domain here if it isn't verified there.
# email_domains:
#   - legacy-brand.com

# Optional: extra subject wording for this client's forms, on top of the defaults
# (onboarding / new starter / new user ... and offboarding / leaver / exit ...).
# starter_subject_keywords: ["it request"]
# leaver_subject_keywords: ["staff departure form"]

approval_required: true
